<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena Shooter</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1f24; font-family: system-ui, sans-serif; }
    #game { display: block; width: 100%; height: 100%; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
      background: #fff; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.6); pointer-events: none; }
    #info { position: fixed; left: 12px; top: 10px; color: #fff; font-size: 13px; text-shadow: 0 1px 2px #000; pointer-events: none; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(20, 24, 30, .72); color: #eef1f5; cursor: pointer; }
    #overlay .box { max-width: 420px; padding: 28px 32px; background: rgba(30, 35, 44, .95); border-radius: 10px; }
    #overlay h1 { margin: 0 0 4px; font-size: 26px; }
    #overlay p { margin: 0 0 18px; color: #aab4c0; }
    #overlay table { border-collapse: collapse; font-size: 14px; }
    #overlay td { padding: 3px 14px 3px 0; }
    #overlay td:first-child { color: #ffd27a; white-space: nowrap; }
    #overlay .start { margin-top: 20px; font-weight: 600; color: #fff; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair"></div>
  <div id="info"></div>
  <div id="overlay">
    <div class="box">
      <h1>Arena Shooter</h1>
      <p>V1 · Testkarte · nur Bewegung</p>
      <table>
        <tr><td>W A S D</td><td>Laufen</td></tr>
        <tr><td>Maus</td><td>Umsehen</td></tr>
        <tr><td>Leertaste</td><td>Springen</td></tr>
        <tr><td>C oder Strg</td><td>Ducken (in der Luft: Ducksprung)</td></tr>
        <tr><td>Shift</td><td>Schleichen</td></tr>
        <tr><td>F</td><td>Vollbild (dann ist auch Strg+W sicher)</td></tr>
        <tr><td>R</td><td>Zurück zum Start</td></tr>
        <tr><td>F3</td><td>Anzeige oben links an/aus</td></tr>
        <tr><td>Esc</td><td>Pause</td></tr>
      </table>
      <div class="start">Klicken zum Starten</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
